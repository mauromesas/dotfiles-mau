# ┌───────────────────────────┐
# │       Windows Style       │
# └───────────────────────────┘

general { 
    gaps_in = 4
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(404040ee)
    col.inactive_border = rgba(181818ee)
    resize_on_border = false 
    allow_tearing = false
    layout = dwindle
}

# [Layouts]
dwindle {
    pseudotile = true 
    preserve_split = true
}
master {
    new_status = master
}

# [Misc]
misc { 
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}